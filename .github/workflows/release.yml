name: release

on:
  push:
    branches: [main]

# The release commits the built `dist/` and the version bump, then tags it.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      # Built here rather than trusted from a laptop, so what a tag points at is
      # what this commit actually compiles to.
      - run: bun run build

      # semantic-release is Node's, and wants its own runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npx --yes
          -p semantic-release@24
          -p @semantic-release/changelog@6
          -p @semantic-release/git@10
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
